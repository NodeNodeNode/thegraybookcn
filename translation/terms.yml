# 灰皮书中文版术语表
#
# 这是术语的唯一真源，机器可读。TERMINOLOGY.md 由脚本从这里生成，不要手写那一份。
#
# 为什么要有 forbid 字段：术语漂移只有在你枚举了「错的长什么样」之后才是可检测的。
# 每次发现一处不一致，就把错误译法补进对应条目的 forbid，从此它再也不会重新出现。
#
# 棘轮规则（硬性）：翻译某页时新决定的术语，必须在同一个 commit 里写进本文件。
# 没进表，这页就不算翻完。术语表只增不减，gb:check-terms 是逼它生长的那个力。
#
# 字段说明
#   en          英文原词（大小写按上游正文里的实际写法）
#   zh          中文译法。status 为 keep-en 时留空
#   status      decided    已拍板，必须照此译
#               provisional 顺手译的，可被推翻，但在推翻前也要统一
#               keep-en    保留英文不译
#               open       尚未决定，禁止在新译文里使用，必须先拍板
#   case        保留英文时的正确大小写形式（可多个，如单复数）
#   forbid      曾出现过的错误译法/错误写法，检查器直接报 error
#   forbid_bare_en  true 表示中文语境里裸用英文原词也算违规（该译却没译）
#   first_use   true 表示本词在每页首次出现时应写成 *English（中文）* 的斜体并列形式
#   scope       限定生效目录（省略则全局）
#   note        决策理由。半年后别人（包括你自己）会来问为什么，写清楚省一次争论
#   decided_at  拍板日期

terms:
  # ── 语言核心概念 ──────────────────────────────────────────────
  - en: patch
    zh: 草图
    status: decided
    forbid: [图档]
    forbid_bare_en: true
    first_use: true
    note: >-
      现有译文里 34 处「草图」、4 处「图档」、18 处裸用 patch。取多数派，且
      「类型草图 / 文档草图」这套搭配已经长出来了。2026-08-11 由 RED 拍板。
    decided_at: 2026-08-11

  - en: node
    zh: 节点
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: link
    zh: 连线
    status: decided
    note: 指节点之间的连接。不要译成「链接」，那是 hyperlink。
    decided_at: 2026-08-11

  - en: pin
    zh: 针脚
    status: decided
    forbid: [阵脚]
    first_use: true
    note: 「阵脚」是 the_nodebrowser 那页的手误，已列入 forbid 防止复发。
    decided_at: 2026-08-11

  - en: IOBox
    status: keep-en
    case: [IOBox, IOBoxes]
    note: >-
      保留英文。首次出现可加括号注「输入输出盒子」，但正文一律用 IOBox。
      这是 vvvv 社区口语里的固定说法，译成中文反而增加理解成本。
    decided_at: 2026-08-11

  - en: pad
    status: keep-en
    case: [Pad, Pads]
    forbid: [数据板]
    note: >-
      保留英文。2026-08-13 由 RED 拍板，推翻 8-12 那次「数据板」的决定。
      推翻的直接理由是当初那条决策自己写着「与 IOBox 本质相同」，而 IOBox 保留英文的
      理由是「社区口语固定说法，译成中文反而增加理解成本」—— 同一条理由对 Pad 完全成立，
      当时却把它译了，这本身就不自洽。
      「数据板」翻的是「板子」这个视觉比喻，没有传达「这是个变量」。
      Pad 在 VL 里本质就是变量（草图里是字段，Operation 里是局部变量），
      所以 properties 页首次出现处补了一句「Pad 就是草图里的变量」作为心智模型。
      「数据板」已列入 forbid，防止回潮。
    decided_at: 2026-08-13

  - en: region
    zh: 区块
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: operation
    status: keep-en
    case: [Operation, Operations]
    forbid: [运算器, 操作器]
    note: >-
      保留英文。2026-08-13 由 RED 拍板，推翻 8-11 沿用下来的「运算器」。
      原译者在 language/operations.md 里专门写过 :::note 论证这个选择
      （「Operations 可以翻译成运算器，操作器等等……这里先采用运算器」），
      当时的取舍是认真的，这里记一笔。
      推翻的理由有两条：一、中文《计算机组成原理》里「运算器」就是 ALU
      （算术逻辑单元），CPU = 运算器 + 控制器 —— 对科班读者是明确的撞词；
      二、「-器」是设备后缀，而 Operation 是一段可调用的逻辑，不是设备。
      与 spread / delegate / generic / aspect 同一策略，界面上写的也是 Operation。
      「运算器」「操作器」均已列入 forbid。
    decided_at: 2026-08-13

  - en: static operation
    zh: 静态 Operation
    status: decided
    forbid: [静态运算器]
    decided_at: 2026-08-13

  - en: member operation
    zh: 成员 Operation
    status: decided
    forbid: [成员运算器]
    decided_at: 2026-08-13

  - en: process node
    zh: 过程节点
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: datatype patch
    zh: 类型草图
    status: decided
    decided_at: 2026-08-11

  - en: document patch
    zh: 文档草图
    status: decided
    decided_at: 2026-08-11

  - en: data type
    zh: 数据类型
    status: decided
    decided_at: 2026-08-11

  - en: definition
    zh: 定义
    status: decided
    note: Definition vs. Application 译作「定义和应用」。
    decided_at: 2026-08-11

  - en: instance
    zh: 实例
    status: decided
    decided_at: 2026-08-11

  - en: immutable
    zh: 不可变
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: mutable
    zh: 可变
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: Record
    status: keep-en
    case: [Record]
    note: Record 与 Class 是 VL 的两种 patch 类型，保留英文。动词化时可写「记录和类运算」。
    decided_at: 2026-08-11

  - en: Class
    status: keep-en
    case: [Class]
    decided_at: 2026-08-11

  # ── 开发环境 ──────────────────────────────────────────────────
  - en: node browser
    zh: 节点浏览器
    status: decided
    decided_at: 2026-08-11

  - en: patch explorer
    zh: 草图浏览器
    status: decided
    note: >-
      与已定的 node browser=节点浏览器 平行。它是编辑器里的一个面板，
      正文用中文，指菜单项或界面标签时保留 `Patch Explorer`。
      2026-08-12 翻 patch-explorer 页时定。
    decided_at: 2026-08-12

  - en: help browser
    zh: 帮助面板
    status: decided
    forbid: [帮助面包]
    note: 「帮助面包」是手误。菜单项本身出现时保留英文 `Help Browser`。
    decided_at: 2026-08-11

  - en: help patch
    zh: 帮助文档
    status: decided
    decided_at: 2026-08-11

  - en: category
    zh: 目录
    status: decided
    forbid: [类别目录]
    note: >-
      指 VL 里节点的归类层级。现有译文 13 处用「目录」，C# 那页写成「类别目录」
      属离群值。注意不要和文件系统的目录混淆，必要时写「节点目录」。
    decided_at: 2026-08-11

  - en: library
    zh: 节点库
    status: decided
    forbid_bare_en: true
    note: 中文语境里不要裸用 Library。指 NuGet 包形态的第三方库时也用「节点库」。
    decided_at: 2026-08-11

  - en: editor extension
    zh: 编辑器扩展
    status: decided
    forbid: [编辑环境扩展]
    note: 现有译文标题用「编辑器扩展」、正文链接用「编辑环境扩展」，取前者。
    decided_at: 2026-08-11

  - en: NuGet
    status: keep-en
    case: [NuGet, NuGets]
    # 不再单列 forbid：Nuget/Nugets 等错误写法已被上面的 case 检查覆盖，
    # 两边都写会让同一处违规被报两次。
    note: >-
      现有译文有 nuget 22 处、Nuget 14 处、NuGet 6 处三种写法。统一为官方写法
      NuGet（复数 NuGets）。检查器会跳过代码块与链接地址，nuget.org 这类不受影响。
    decided_at: 2026-08-11

  - en: dependency
    zh: 依赖
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: project
    zh: 项目
    status: decided
    decided_at: 2026-08-11

  - en: tag
    zh: 标签
    status: decided
    decided_at: 2026-08-11

  - en: theme
    zh: 主题
    status: decided
    decided_at: 2026-08-11

  - en: settings
    zh: 设置
    status: decided
    decided_at: 2026-08-11

  - en: Quad
    status: keep-en
    case: [Quad]
    note: 编辑窗口左上角的灰色 logo 方块。首次出现时加括号释义。
    decided_at: 2026-08-11

  # ── 待拍板：Language 章开工前必须定 ─────────────────────────────
  - en: spread
    status: keep-en
    case: [Spread, Spreads]
    note: >-
      保留英文。vvvv 社区口语里 Spread 就是 Spread，没有任何中译能不损失含义
      （它既不是数组也不是列表，是 vvvv 特有的数据组织方式）。首次出现可加括号
      简述，正文一律用 Spread。2026-08-12 由 RED 拍板。
    decided_at: 2026-08-12

  - en: delegate
    status: keep-en
    case: [Delegate, Delegates]
    note: 保留英文。与 spread 同理，是 VL/.NET 的技术概念。2026-08-12 由 RED 拍板。
    decided_at: 2026-08-12

  - en: generic
    status: keep-en
    case: [Generic, Generics]
    note: >-
      保留英文。中文里「泛型」是成熟译法，但 RED 选择与 spread / delegate 保持一致，
      且 VL 界面上的 `Is Generic` 本来就是英文原样呈现。2026-08-12 拍板。
    decided_at: 2026-08-12

  - en: group patch
    status: keep-en
    case: [group patch, group patches, Group patch, Group Patch]
    note: >-
      保留英文。2026-08-12 由 RED 拍板。
      大小写放宽到四种：上游自己就不一致（groups.md 用 Group patch，patches.md 用
      group patch），而作为并列的类型名（与 Document Patch / Datatype Patch 同列）时
      标题式大写才是对的。句中行文用小写。
    decided_at: 2026-08-12

  - en: property
    zh: 参数
    status: decided
    note: >-
      沿用现有译文的「参数」。注意与下面的 option 区分：过去两者都被译成「参数」，
      是全书最容易混淆的一处。property 是数据类型上定义的可读写成员，option 是界面选项。
    decided_at: 2026-08-12

  - en: option
    zh: 选项
    status: decided
    note: >-
      界面上的选项，译「选项」不译「参数」—— 后者留给 property。
      这是为解开撞词而做的调整，翻译时务必按语境分清。
    decided_at: 2026-08-12

  # ── 数据流的基本词汇 ──────────────────────────────────────────
  - en: data hub
    zh: 数据枢纽
    status: decided
    first_use: true
    note: >-
      上游在 lo_0_dataHubs 里专门造了这个词，用来统称针脚这类「可以连上去的地方」，
      再往下分成 data source 和 data sink 两种。译「数据枢纽」。
      注意它是上位概念：正文说「针脚」时不要替换成「数据枢纽」，反之亦然。
    decided_at: 2026-08-12

  - en: data source
    zh: 数据源
    status: decided
    first_use: true
    note: >-
      与 data sink 成对。这一对是数据流的地基词，几乎每页都要用，所以先于
      Language 章拍板。单说 source 时也译「数据源」—— 但「源文档」「源码」这类
      与数据流无关的 source 不受本条约束，按语境正常译。
    decided_at: 2026-08-12

  - en: data sink
    zh: 数据汇点
    status: decided
    first_use: true
    note: >-
      与 data source 成对，取信号处理里 source/sink 的标准中译「源／汇」。
      「汇点」比「接收端」短且不会与网络语境的「接收方」混淆。
      单说 sink 时译「汇点」，正文里凡是与 source 并举处一律用全称「数据汇点」。
      2026-08-12 翻 mut2 / lo_0_dataHubs 时定 —— 这两页正是定义这一对词的地方。
    decided_at: 2026-08-12

  - en: reference
    zh: 引用
    status: decided
    first_use: true
    note: >-
      指向内存中某个位置的引用，与不可变数据相对。不要译成「参考」，
      也不要与 hyperlink 的「链接」或 link 的「连线」混淆。
    decided_at: 2026-08-12

  - en: builder
    zh: 构建器
    status: decided
    first_use: true
    note: >-
      Builder 模式的标准中译。刻意不用「构造器」—— 那个词在 .NET 语境里
      已经被 constructor 占了，两者在同一本书里撞车会很难拆。
      类型名 SpreadBuilder 保留英文原样，正文泛指时用「构建器」。
    decided_at: 2026-08-12

  # ── 扩展 vvvv 章 ──────────────────────────────────────────────
  - en: aspect
    status: keep-en
    case: [Aspect, Aspects, aspect, aspects]
    note: >-
      保留英文。两个现成的中译都会撞车：「切面」是 AOP 的 aspect，和这里
      「标记节点面向哪类用户」完全是两回事；「特性」在 .NET 语境里已被
      Attribute 占了，而本章正好同时在讲 .NET。Aspect 的取值本身
      （Advanced / Internal / Experimental / Obsolete / Adaptive）
      是 VL 里的目录名，必须原样保留 —— 词保留英文，读者反而对得上界面。
      大小写放宽到四种：标题式与句中式上游都在用。
    decided_at: 2026-08-12

  - en: adaptive
    zh: 自适应
    status: decided
    note: >-
      指 VL 的 adaptive 节点体系（每个类型都能实现同一个节点签名）。
      注意目录名 `Advanced`、`Math.Adaptive` 这类是界面上的字面值，保留英文。
    decided_at: 2026-08-12

  - en: node factory
    zh: 节点工厂
    status: decided
    first_use: true
    decided_at: 2026-08-12

  - en: package repository
    zh: 包仓库
    status: decided
    note: >-
      沿用 compilation.md 已有的译法。`--package-repositories` 是命令行参数，
      保留英文原样。「源码包仓库」= source package-repository，同一套词。
    decided_at: 2026-08-12

  - en: wrapper
    zh: 包装器
    status: decided
    first_use: true
    note: 动词 wrap 译「包装」。指把第三方 .NET 库裹成 VL 友好形态的那一层。
    decided_at: 2026-08-12

  - en: border control point
    zh: 边界控制点
    status: decided
    first_use: true
    note: >-
      区块边框上那些让数据进出的控制点。上游正文里大量简写为 BCP，
      译文首次出现给出全称并标注 BCP，之后沿用 BCP —— 一页里出现几十次，
      全写中文会把句子压垮。
    decided_at: 2026-08-12

  - en: patch inlay
    zh: 内嵌草图
    status: decided
    first_use: true
    note: >-
      IRegion API 里指区块内部那张由用户打的草图。不译「嵌片」—— 它首先是一张草图，
      「内嵌」说的是它的位置。与 region patch 是同一个东西的两种叫法。
    decided_at: 2026-08-12

  - en: callback
    zh: 回调
    status: decided
    first_use: true
    decided_at: 2026-08-12

  - en: help flag
    zh: 帮助标记
    status: decided
    first_use: true
    note: 不用「帮助旗标」—— 界面上它就是一个小标记，不是旗子。
    decided_at: 2026-08-12

  - en: Observable
    status: keep-en
    case: [Observable, Observables]
    note: Rx 的核心概念，与 VL 的响应式体系直接对应。保留英文，已有译文即如此。
    decided_at: 2026-08-12

  # ── 节点库章 ──────────────────────────────────────────────────
  - en: mesh
    zh: 网格
    status: decided
    note: >-
      3D 图形里的标准中译。Stride 的类型名 `Mesh`、`MeshDraw`、`MeshEntity` 等
      在正文里保留英文并加反引号 —— 那是界面和代码里的字面名字，与泛指的「网格」分开。
    decided_at: 2026-08-12

  - en: framebased
    zh: 逐帧
    status: decided
    note: >-
      与 timebased 成对。节点名和目录名里的 `FrameBased`（如
      `ImagePlayer (FrameBased Stride)`、Animation 下的 FrameBased 子目录）
      是界面字面值，保留英文原样；正文行文用「逐帧」。
    decided_at: 2026-08-13

  - en: timebased
    zh: 基于时间
    status: decided
    note: 与 framebased 成对。不译「时基」—— 那在视频领域另有所指（time base）。
    decided_at: 2026-08-13

  - en: slice
    status: keep-en
    case: [slice, slices, Slice, Slices]
    note: >-
      保留英文，与 spread 同理 —— Spread 里的一项就叫 slice，这是 vvvv 社区口语。
      按仓库既有事实定：现有译文 16 处全是裸用英文，0 处「切片」。
      大小写放宽到四种：句中行文用小写（loops.md 全篇如此），
      作为类型名或节点名的一部分时（GetSlice、Slice 类型）才大写。
    decided_at: 2026-08-12


  # applet 曾列在这里等拍板，但全上游和全部译文里一处都没有 —— 是当初凭空列的。
  # 已删除：一个没人用的 open 词条只会让「待拍板」计数永远不归零，稀释信号。
  - en: shader
    zh: 着色器
    status: decided
    first_use: true
    note: >-
      按仓库既有事实定，不是新拍：现有译文 42 处「着色器」对 17 处裸用，
      而裸用的多是 `shaders` 文件夹名、SDSL、ShaderFX 这类专名。
      刻意不设 forbid_bare_en —— 那些专名必须保留原样。
    decided_at: 2026-08-12
