# 灰皮书中文版术语表
#
# 这是术语的唯一真源，机器可读。TERMINOLOGY.md 由脚本从这里生成，不要手写那一份。
#
# 为什么要有 forbid 字段：术语漂移只有在你枚举了「错的长什么样」之后才是可检测的。
# 每次发现一处不一致，就把错误译法补进对应条目的 forbid，从此它再也不会重新出现。
#
# 棘轮规则（硬性）：翻译某页时新决定的术语，必须在同一个 commit 里写进本文件。
# 没进表，这页就不算翻完。术语表只增不减，gb:check-terms 是逼它生长的那个力。
#
# 字段说明
#   en          英文原词（大小写按上游正文里的实际写法）
#   zh          中文译法。status 为 keep-en 时留空
#   status      decided    已拍板，必须照此译
#               provisional 顺手译的，可被推翻，但在推翻前也要统一
#               keep-en    保留英文不译
#               open       尚未决定，禁止在新译文里使用，必须先拍板
#   case        保留英文时的正确大小写形式（可多个，如单复数）
#   forbid      曾出现过的错误译法/错误写法，检查器直接报 error
#   forbid_bare_en  true 表示中文语境里裸用英文原词也算违规（该译却没译）
#   first_use   true 表示本词在每页首次出现时应写成 *English（中文）* 的斜体并列形式
#   scope       限定生效目录（省略则全局）
#   note        决策理由。半年后别人（包括你自己）会来问为什么，写清楚省一次争论
#   decided_at  拍板日期

terms:
  # ── 语言核心概念 ──────────────────────────────────────────────
  - en: patch
    zh: 草图
    status: decided
    forbid: [图档]
    forbid_bare_en: true
    first_use: true
    note: >-
      现有译文里 34 处「草图」、4 处「图档」、18 处裸用 patch。取多数派，且
      「类型草图 / 文档草图」这套搭配已经长出来了。2026-08-11 由 RED 拍板。
    decided_at: 2026-08-11

  - en: node
    zh: 节点
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: link
    zh: 连线
    status: decided
    note: 指节点之间的连接。不要译成「链接」，那是 hyperlink。
    decided_at: 2026-08-11

  - en: pin
    zh: 针脚
    status: decided
    forbid: [阵脚]
    first_use: true
    note: 「阵脚」是 the_nodebrowser 那页的手误，已列入 forbid 防止复发。
    decided_at: 2026-08-11

  - en: IOBox
    status: keep-en
    case: [IOBox, IOBoxes]
    note: >-
      保留英文。首次出现可加括号注「输入输出盒子」，但正文一律用 IOBox。
      这是 vvvv 社区口语里的固定说法，译成中文反而增加理解成本。
    decided_at: 2026-08-11

  - en: pad
    zh: 数据板
    status: provisional
    first_use: true
    note: 现有译文用「数据板」但只有 3 处，样本量小，后续 Language 章可推翻。
    decided_at: 2026-08-11

  - en: region
    zh: 区块
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: operation
    zh: 运算器
    status: decided
    forbid: [操作器]
    first_use: true
    note: >-
      原译者在 language/operations.md 里专门写了 :::note 论证过这个选择
      （「Operations 可以翻译成运算器，操作器等等……这里先采用运算器」）。
      沿用，并把「操作器」列入 forbid。
    decided_at: 2026-08-11

  - en: static operation
    zh: 静态运算器
    status: decided
    decided_at: 2026-08-11

  - en: member operation
    zh: 成员运算器
    status: decided
    decided_at: 2026-08-11

  - en: process node
    zh: 过程节点
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: datatype patch
    zh: 类型草图
    status: decided
    decided_at: 2026-08-11

  - en: document patch
    zh: 文档草图
    status: decided
    decided_at: 2026-08-11

  - en: data type
    zh: 数据类型
    status: decided
    decided_at: 2026-08-11

  - en: definition
    zh: 定义
    status: decided
    note: Definition vs. Application 译作「定义和应用」。
    decided_at: 2026-08-11

  - en: instance
    zh: 实例
    status: decided
    decided_at: 2026-08-11

  - en: immutable
    zh: 不可变
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: mutable
    zh: 可变
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: Record
    status: keep-en
    case: [Record]
    note: Record 与 Class 是 VL 的两种 patch 类型，保留英文。动词化时可写「记录和类运算」。
    decided_at: 2026-08-11

  - en: Class
    status: keep-en
    case: [Class]
    decided_at: 2026-08-11

  # ── 开发环境 ──────────────────────────────────────────────────
  - en: node browser
    zh: 节点浏览器
    status: decided
    decided_at: 2026-08-11

  - en: help browser
    zh: 帮助面板
    status: decided
    forbid: [帮助面包]
    note: 「帮助面包」是手误。菜单项本身出现时保留英文 `Help Browser`。
    decided_at: 2026-08-11

  - en: help patch
    zh: 帮助文档
    status: decided
    decided_at: 2026-08-11

  - en: category
    zh: 目录
    status: decided
    forbid: [类别目录]
    note: >-
      指 VL 里节点的归类层级。现有译文 13 处用「目录」，C# 那页写成「类别目录」
      属离群值。注意不要和文件系统的目录混淆，必要时写「节点目录」。
    decided_at: 2026-08-11

  - en: library
    zh: 节点库
    status: decided
    forbid_bare_en: true
    note: 中文语境里不要裸用 Library。指 NuGet 包形态的第三方库时也用「节点库」。
    decided_at: 2026-08-11

  - en: editor extension
    zh: 编辑器扩展
    status: decided
    forbid: [编辑环境扩展]
    note: 现有译文标题用「编辑器扩展」、正文链接用「编辑环境扩展」，取前者。
    decided_at: 2026-08-11

  - en: NuGet
    status: keep-en
    case: [NuGet, NuGets]
    # 不再单列 forbid：Nuget/Nugets 等错误写法已被上面的 case 检查覆盖，
    # 两边都写会让同一处违规被报两次。
    note: >-
      现有译文有 nuget 22 处、Nuget 14 处、NuGet 6 处三种写法。统一为官方写法
      NuGet（复数 NuGets）。检查器会跳过代码块与链接地址，nuget.org 这类不受影响。
    decided_at: 2026-08-11

  - en: dependency
    zh: 依赖
    status: decided
    first_use: true
    decided_at: 2026-08-11

  - en: project
    zh: 项目
    status: decided
    decided_at: 2026-08-11

  - en: tag
    zh: 标签
    status: decided
    decided_at: 2026-08-11

  - en: theme
    zh: 主题
    status: decided
    decided_at: 2026-08-11

  - en: settings
    zh: 设置
    status: decided
    decided_at: 2026-08-11

  - en: Quad
    status: keep-en
    case: [Quad]
    note: 编辑窗口左上角的灰色 logo 方块。首次出现时加括号释义。
    decided_at: 2026-08-11

  # ── 待拍板：Language 章开工前必须定 ─────────────────────────────
  - en: spread
    status: keep-en
    case: [Spread, Spreads]
    note: >-
      保留英文。vvvv 社区口语里 Spread 就是 Spread，没有任何中译能不损失含义
      （它既不是数组也不是列表，是 vvvv 特有的数据组织方式）。首次出现可加括号
      简述，正文一律用 Spread。2026-08-12 由 RED 拍板。
    decided_at: 2026-08-12

  - en: delegate
    status: keep-en
    case: [Delegate, Delegates]
    note: 保留英文。与 spread 同理，是 VL/.NET 的技术概念。2026-08-12 由 RED 拍板。
    decided_at: 2026-08-12

  - en: generic
    status: keep-en
    case: [Generic, Generics]
    note: >-
      保留英文。中文里「泛型」是成熟译法，但 RED 选择与 spread / delegate 保持一致，
      且 VL 界面上的 `Is Generic` 本来就是英文原样呈现。2026-08-12 拍板。
    decided_at: 2026-08-12

  - en: group patch
    status: keep-en
    case: [group patch, group patches, Group patch, Group Patch]
    note: >-
      保留英文。2026-08-12 由 RED 拍板。
      大小写放宽到四种：上游自己就不一致（groups.md 用 Group patch，patches.md 用
      group patch），而作为并列的类型名（与 Document Patch / Datatype Patch 同列）时
      标题式大写才是对的。句中行文用小写。
    decided_at: 2026-08-12

  - en: property
    zh: 参数
    status: decided
    note: >-
      沿用现有译文的「参数」。注意与下面的 option 区分：过去两者都被译成「参数」，
      是全书最容易混淆的一处。property 是数据类型上定义的可读写成员，option 是界面选项。
    decided_at: 2026-08-12

  - en: option
    zh: 选项
    status: decided
    note: >-
      界面上的选项，译「选项」不译「参数」—— 后者留给 property。
      这是为解开撞词而做的调整，翻译时务必按语境分清。
    decided_at: 2026-08-12

  # ── 尚未在任何译文里出现，但上游高频，翻到时需先拍板 ──────────────
  - en: sink
    status: open
    note: Language 章 execution-order 等页会用到。
    decided_at: null

  - en: source
    status: open
    note: 与 sink 成对，一起定。
    decided_at: null

  - en: applet
    status: open
    decided_at: null

  - en: shader
    status: open
    note: Libraries/3D 章的术语体系，等翻到那章再统一扩表。
    scope: reference/libraries/
    decided_at: null
