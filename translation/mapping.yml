# 本地译文 ↔ 上游页面 的对应账本
#
# 用途有二：
#   1. Phase 1 迁移的输入 —— 告诉 gb:migrate 每个现有文件该搬到哪个 1:1 路径
#   2. 长期的审校台账 —— review 状态记在这里，不进 frontmatter
#      （frontmatter 白名单要保持干净，审校状态也不该发布到站点）
#
# 字段
#   source        上游文件路径，同步主键
#   from          迁移前的本地路径（相对 docs/），迁移完成后可留作历史记录
#   completeness  翻译完整度，来自与上游篇幅的对比估算
#                   translated 基本完整（≥80%）
#                   partial    只译了一部分
#                   stub       只有 frontmatter，正文为空
#   review        todo | drafted | reviewed | locked
#   reviewed_at   审校通过时的 commit sha，之后该文件若再被改动即自动标记需复审
#   note          需要人工注意的事项

